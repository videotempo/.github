<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-label="How a VideoTempo video is made: voice, design, check, render">
<style>
.c{transform-box:fill-box;transform-origin:center;animation:lift 8s ease-in-out infinite}
.c1{animation-delay:2s}.c2{animation-delay:4s}.c3{animation-delay:6s}
@keyframes lift{0%,30%,100%{transform:none;filter:none}8%,22%{transform:translateY(-8px);filter:drop-shadow(0 10px 14px rgba(255,106,77,.35))}}
.bar{animation:run 8s linear infinite}@keyframes run{from{width:0}to{width:1200px}}
</style>
<rect width="1280" height="250" rx="24" fill="#f6f2ee"/>
<g transform="translate(40 30)"><g class="c c0">
